services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    container_name: adaptive_learning_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learner_pass}
      POSTGRES_DB: ${POSTGRES_DB:-adaptive_learning}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learner} -d ${POSTGRES_DB:-adaptive_learning}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: adaptive_learning_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adaptive_learning_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - model_cache:/app/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  model_cache:
